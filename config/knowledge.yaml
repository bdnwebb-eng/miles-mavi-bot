# ─────────────────────────────────────────────────────────────
# MILES'S KNOWLEDGE BASE · how he runs Kas's world.
# v6 · updated 2026-07-21 from India's Jul 14 to 16 handover corpus
# in the annotated one pager (CHF SKU truth, proposal voice corpus,
# operating rules, automation backlog, filing principle captured).
# Injected into the system prompt. Never add facts about Kas,
